<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0D0D14;
    --bg-panel:#1A1A2E;
    --accent-deep:#7B2FF7;
    --accent-light:#9D4EDD;
    --ink:#EAEAEA;
    --ink-dim:#8C8C9C;
    --border: rgba(234,234,234,0.08);
    --radius: 18px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{ height:100%; }

  body{
    background: var(--bg-void);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* ambient background glow */
  body::before{
    content:"";
    position:fixed;
    top:-20%; left:50%;
    width:140vw; height:60vh;
    transform:translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(123,47,247,0.16), transparent 65%);
    pointer-events:none;
    z-index:0;
  }

  .app{
    position:relative;
    z-index:1;
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding: 28px 20px 100px;
    display:flex;
    flex-direction:column;
    gap:32px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand-mark{
    width:34px; height:34px;
    border-radius:10px;
    background: linear-gradient(135deg, var(--accent-light), var(--accent-deep));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
    color:#0D0D14;
    box-shadow: 0 0 24px rgba(157,78,221,0.45);
  }

  .brand-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.01em;
  }

  .avatar-btn{
    width:38px; height:38px;
    border-radius:50%;
    background: var(--bg-panel);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-dim);
    cursor:pointer;
  }
  .avatar-btn:focus-visible{ outline:2px solid var(--accent-light); outline-offset:2px; }

  /* ---------- Hero / greeting with signature halo ---------- */
  .hero{
    position:relative;
    padding: 30px 4px 6px;
  }

  .halo{
    position:absolute;
    top:-40px; left:-30px;
    width:180px; height:180px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(123,47,247,0.5), transparent 70%);
    filter: blur(10px);
    animation: breathe 5.5s ease-in-out infinite;
    z-index:-1;
  }

  @keyframes breathe{
    0%,100%{ transform:scale(0.9); opacity:0.55; }
    50%{ transform:scale(1.15); opacity:0.9; }
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--accent-light);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
  }

  .eyebrow .dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--accent-light);
    box-shadow: 0 0 8px var(--accent-light);
    animation: pulse-dot 2.4s ease-in-out infinite;
  }

  @keyframes pulse-dot{
    0%,100%{ opacity:1; }
    50%{ opacity:0.3; }
  }

  .greeting{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:30px;
    line-height:1.15;
    letter-spacing:-0.01em;
  }

  .greeting span{
    background: linear-gradient(90deg, var(--ink), var(--accent-light));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .day-summary{
    margin-top:10px;
    font-size:14px;
    line-height:1.55;
    color: var(--ink-dim);
    max-width:38ch;
  }

  /* ---------- Stats row ---------- */
  .stats{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
  }

  .stat-card{
    background: var(--bg-panel);
    border:1px solid var(--border);
    border-radius: 14px;
    padding: 14px 10px;
    text-align:left;
  }

  .stat-value{
    font-family:'JetBrains Mono', monospace;
    font-size:22px;
    font-weight:500;
    color: var(--ink);
  }

  .stat-label{
    margin-top:4px;
    font-size:11px;
    color: var(--ink-dim);
    line-height:1.3;
  }

  /* ---------- Section heading ---------- */
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }

  .section-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:16px;
  }

  .section-link{
    font-size:12px;
    color: var(--accent-light);
    text-decoration:none;
  }

  /* ---------- Quick access grid ---------- */
  .quick-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }

  .quick-card{
    background: var(--bg-panel);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:22px;
    cursor:pointer;
    text-align:left;
    color:inherit;
    font-family:inherit;
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }

  .quick-card:hover{
    border-color: rgba(157,78,221,0.4);
    transform: translateY(-2px);
  }
  .quick-card:focus-visible{
    outline:2px solid var(--accent-light);
    outline-offset:2px;
  }

  .quick-card.chat{
    grid-column: 1 / -1;
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    background: linear-gradient(120deg, rgba(123,47,247,0.22), rgba(26,26,46,0.9));
  }

  .quick-icon{
    width:36px; height:36px;
    border-radius:10px;
    background: rgba(157,78,221,0.14);
    color: var(--accent-light);
    display:flex; align-items:center; justify-content:center;
  }

  .quick-icon svg{ width:18px; height:18px; }

  .quick-label{
    font-size:14px;
    font-weight:500;
  }

  .quick-sub{
    margin-top:2px;
    font-size:11.5px;
    color: var(--ink-dim);
  }

  .chat .quick-label{ font-family:'Space Grotesk', sans-serif; font-size:15px; }

  .chat-arrow{
    width:32px; height:32px;
    border-radius:50%;
    background: var(--accent-deep);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .chat-arrow svg{ width:16px; height:16px; color:#fff; }

  /* ---------- Bottom nav ---------- */
  .tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    display:flex;
    justify-content:center;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    z-index:5;
  }

  .tabbar-inner{
    width:100%;
    max-width:440px;
    background: rgba(26,26,46,0.85);
    backdrop-filter: blur(16px);
    border:1px solid var(--border);
    border-radius: 20px;
    padding:8px;
    display:flex;
    justify-content:space-between;
  }

  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 4px;
    border-radius:14px;
    color: var(--ink-dim);
    background:none;
    border:none;
    font-family:'Inter', sans-serif;
    font-size:10px;
    cursor:pointer;
  }
  .tab svg{ width:19px; height:19px; }
  .tab.active{ color: var(--ink); background: rgba(123,47,247,0.18); }
  .tab:focus-visible{ outline:2px solid var(--accent-light); outline-offset:2px; }

  @media (max-width:340px){
    .greeting{ font-size:26px; }
  }

  /* ---------- Splash screen ---------- */
  .splash{
    position:fixed;
    inset:0;
    z-index:50;
    background: var(--bg-void);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  .splash.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  .splash-ring{
    position:relative;
    width:132px; height:132px;
    display:flex; align-items:center; justify-content:center;
  }

  .splash-ring::before{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(123,47,247,0.55), transparent 70%);
    filter: blur(6px);
    animation: breathe 2.6s ease-in-out infinite;
  }

  .splash-logo{
    width:132px; height:132px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid rgba(157,78,221,0.5);
    box-shadow: 0 0 40px rgba(123,47,247,0.4);
    position:relative;
  }

  .splash-word{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:0.02em;
  }

  .splash-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--ink-dim);
  }

  /* brand mark using logo image */
  .brand-mark-img{
    width:34px; height:34px;
    border-radius:50%;
    object-fit:cover;
    box-shadow: 0 0 16px rgba(123,47,247,0.45);
    border:1px solid rgba(157,78,221,0.4);
  }
</style>
</head>

<script>
  // ---------- Données locales (Phase 1 : localStorage, sera remplacé par Room/Firebase) ----------
  const STORAGE_KEY = 'blessing_ai_data_v1';

  function loadData(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ return JSON.parse(raw); }
    // Données de démonstration au premier lancement
    const demo = {
      userName: 'Gedorah',
      notes: [
        { id:1, title:'Idée: fonctionnalité de résumé', category:'Idées' },
        { id:2, title:'Cours de réseaux — chap 3', category:'Études' }
      ],
      events: [
        { id:1, title:'Réunion JCC', date: new Date(Date.now()+86400000).toISOString() }
      ],
      tasks: [
        { id:1, title:'Finir le TP02', done:false },
        { id:2, title:'Réviser algo', done:false },
        { id:3, title:'Lire chap. 4', done:true }
      ]
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(demo));
    return demo;
  }

  function getGreetingWord(hour){
    if(hour < 5) return 'Bonne nuit';
    if(hour < 12) return 'Bonjour';
    if(hour < 18) return 'Bon après-midi';
    return 'Bonsoir';
  }

  function render(){
    const data = loadData();
    const now = new Date();

    document.getElementById('userName').textContent = data.userName;
    document.getElementById('greetingWord').textContent = getGreetingWord(now.getHours());

    const notesCount = data.notes.length;
    const upcomingEvents = data.events.filter(e => new Date(e.date) >= now);
    const pendingTasks = data.tasks.filter(t => !t.done);

    document.getElementById('statNotes').textContent = notesCount;
    document.getElementById('statEvents').textContent = upcomingEvents.length;
    document.getElementById('statTasks').textContent = pendingTasks.length;

    const summaryEl = document.getElementById('daySummary');
    if(pendingTasks.length === 0 && upcomingEvents.length === 0){
      summaryEl.textContent = "Ta journée est encore libre. Ajoute une tâche ou consulte ton agenda pour commencer.";
    } else {
      const parts = [];
      if(pendingTasks.length) parts.push(`${pendingTasks.length} tâche${pendingTasks.length>1?'s':''} à finir`);
      if(upcomingEvents.length) parts.push(`${upcomingEvents.length} rendez-vous à venir`);
      summaryEl.textContent = parts.join(' · ') + '.';
    }
  }

  render();

  // ---------- Splash screen ----------
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('splash').classList.add('hide');
    }, 1100);
  });
</script>
